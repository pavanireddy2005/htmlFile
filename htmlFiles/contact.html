<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="container">
        <div class="contact-form">
            <h1>Contact Us</h1>
            <form action="submit_contact.php" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="10" required></textarea>

                <button type="submit">Send Message</button><br /><br />
            </form>
            <p>We will get back to you as soon as possible.</p><br />
            <p>For immediate assistance, please call us at 
                <a href="tel:+1234567890">+1 234 567 890</a>.
            </p>
            <p>Follow us on 
                <a href="https://www.facebook.com">Facebook</a>, 
                <a href="https://www.twitter.com">Twitter</a>, 
                <a href="https://www.instagram.com">Instagram</a>
            </p>
        </div> 
        <div class="right-side">
            <div class="banner">
                <img src="banner.jpeg" alt="Contact Banner">
            </div>
            <div class="map">
                <h2>Our Location</h2>
                <p>Delhi, 123 main street, room.no:2-A</p>
                <div class="map-image">
                    <img src="map.jpeg" alt="Map Location">
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Restaurant Guide. All rights reserved.</p>
        <p>Contact us at <a href="mailto:abc@gmail.com">abc@gmail.com</a></p>
    </footer>
</body>
</html>
